services:
  - type: web
    name: cold-email-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: cold-email-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: cold-email-frontend
    runtime: static
    buildCommand: npm install --prefix frontend --include=dev && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cold-email-studio
          envVarKey: RENDER_EXTERNAL_URL
